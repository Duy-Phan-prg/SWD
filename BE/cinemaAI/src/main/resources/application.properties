# ===============================
# Application
# ===============================
spring.application.name=${APP_NAME:cinemaAI}
spring.config.import=optional:file:.env[.properties],optional:file:cinemaAI/.env[.properties],optional:file:BE/cinemaAI/.env[.properties],optional:dotenv:.env
server.port=${SERVER_PORT:8080}

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}


# ===============================
# Database - PostgreSQL
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://157.245.144.5:5432/cinema_ai}
spring.datasource.username=${DB_USERNAME:postgre}
spring.datasource.password=${DB_PASSWORD:postgre}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=false


# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:always}
management.health.mail.enabled=${HEALTH_MAIL_ENABLED:false}


# ===============================
# Swagger / SpringDoc
# ===============================
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.tags-sorter=${SPRINGDOC_TAGS_SORTER:alpha}
springdoc.swagger-ui.operations-sorter=${SPRINGDOC_OPERATIONS_SORTER:alpha}
springdoc.swagger-ui.display-request-duration=${SPRINGDOC_DISPLAY_REQUEST_DURATION:true}


# ===============================
# Spring AI / OpenAI
# ===============================
spring.ai.openai.api-key=${OPENAI_API_KEY:none}


# ===============================
# Mail - Gmail SMTP
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@cinemaai.com}


# ===============================
# VNPay
# ===============================
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.api-query-url=${VNPAY_API_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay-return}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay-ipn}
vnpay.default-client-ip=${VNPAY_DEFAULT_CLIENT_IP:127.0.0.1}

app.payment.success-redirect-url=${PAYMENT_SUCCESS_REDIRECT_URL:http://localhost:5173/payment/success}


# ===============================
# JWT
# ===============================
app.jwt.secret=${JWT_SECRET:cineai-development-secret-key-please-change-123456}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000}


# ===============================
# Google OAuth
# ===============================
app.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.google.token-info-base-url=${GOOGLE_TOKEN_INFO_BASE_URL:https://oauth2.googleapis.com}


# ===============================
# Booking Hold Cleanup
# ===============================
app.booking.hold-cleanup.enabled=${BOOKING_HOLD_CLEANUP_ENABLED:true}
app.booking.hold-cleanup.fixed-delay-ms=${BOOKING_HOLD_CLEANUP_FIXED_DELAY_MS:60000}


# ===============================
# Cloudinary
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}


# ===============================
# Multipart Upload
# ===============================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}


# ===============================
# Recommendation System Weights
# ===============================
app.recommendation.weights.trailer-complete=${REC_W_TRAILER_COMPLETE:3.0}
app.recommendation.weights.trailer-view-max=${REC_W_TRAILER_VIEW_MAX:2.0}
app.recommendation.weights.trailer-click=${REC_W_TRAILER_CLICK:1.0}
app.recommendation.weights.trailer-skip=${REC_W_TRAILER_SKIP:-0.5}

app.recommendation.weights.booking=${REC_W_BOOKING:5.0}
app.recommendation.weights.ticket-count-max=${REC_W_TICKET_COUNT_MAX:3.0}
app.recommendation.weights.ticket-count-saturation=${REC_W_TICKET_COUNT_SATURATION:5}

app.recommendation.weights.review-high-multiplier=${REC_W_REVIEW_HIGH_MULT:2.0}
app.recommendation.weights.review-low-cap=${REC_W_REVIEW_LOW_CAP:0.5}

app.recommendation.weights.wishlist=${REC_W_WISHLIST:2.0}

app.recommendation.weights.actor-multiplier=${REC_W_ACTOR_MULT:1.5}
app.recommendation.weights.director-multiplier=${REC_W_DIRECTOR_MULT:1.5}
app.recommendation.weights.recency-bonus=${REC_W_RECENCY_BONUS:1.0}
app.recommendation.weights.recency-months=${REC_W_RECENCY_MONTHS:3}


# ===============================
# Seed Accounts
# ===============================
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@cinemaai.com}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:Admin@123}
app.seed.admin.full-name=${SEED_ADMIN_FULL_NAME:Admin}
app.seed.admin.phone=${SEED_ADMIN_PHONE:0900000001}

app.seed.staff.email=${SEED_STAFF_EMAIL:staff@cinemaai.com}
app.seed.staff.password=${SEED_STAFF_PASSWORD:Staff@123}
app.seed.staff.full-name=${SEED_STAFF_FULL_NAME:Staff}
app.seed.staff.phone=${SEED_STAFF_PHONE:0900000002}


# ===============================
# AI Service
# ===============================
ai.url=${AI_URL:http://localhost:8000}
